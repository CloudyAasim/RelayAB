name: Deploy to Dokku

# 触发分支是 server 而不是 main。
# 仓库里 main 与 server 目前是两个独立项目：
#   main  = 原 Vercel 版本（v178，冻结待恢复）
#   server = Debian / Dokku 自托管版本
# 部署 server 上的改动时不要触发 main 的构建。
on:
  push:
    branches:
      - server
  workflow_dispatch:

# Dokku 的同一个 app 不能并发构建，否则会互相覆盖 slug。
#
# 按 ref 分组而不是一个固定名字：同一个分支的两次推送仍然排队，但一次
# 卡在 in_progress 的旧运行（GitHub 偶发：步骤都已完成，job 状态没落地）
# 不会把后续分支/推送一起堵死。2026-10-19 实际遇到过这种僵住 20+ 分钟的情况。
concurrency:
  group: dokku-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate.
  #
  # The type check used to happen inside the production build, on the host,
  # where it took eleven minutes and took the whole box down with it: the
  # kernel's OOM killer reaps sshd and nginx, and the symptom is a site that
  # accepts connections and never answers. The build itself compiles in 44
  # seconds — it is the type check that does not fit in that machine.
  #
  # So the type check moved here, to a runner with memory to spare, and the
  # host is left to do what it is good at: compile. The build still happens on
  # the host; only the *checking* moved.
  #
  # The deploy waits for this job, so a commit that does not type-check or
  # does not pass its tests never reaches the host at all.
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须：浅克隆会让 Dokku 构建失败

      - name: Deploy to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The action pushes this branch name to the Dokku remote, and Dokku
          # builds whatever arrives. The Debian work lives on `server`; the
          # action defaults to `master`, which would push the frozen Vercel
          # code instead — and fail, because the Dokku app's own history is on
          # master and the push is rejected as non-fast-forward.
          branch: server
