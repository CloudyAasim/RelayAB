name: Deploy to Dokku

# 触发分支是 server 而不是 main。
# 仓库里 main 与 server 目前是两个独立项目：
#   main  = 原 Vercel 版本（v178，冻结待恢复）
#   server = Debian / Dokku 自托管版本
# 部署 server 上的改动时不要触发 main 的构建。
on:
  push:
    branches:
      - server
  workflow_dispatch:

# Dokku 的同一个 app 不能并发构建，否则会互相覆盖 slug。
#
# 按 ref 分组而不是一个固定名字：同一个分支的两次推送仍然排队，但一次
# 卡在 in_progress 的旧运行（GitHub 偶发：步骤都已完成，job 状态没落地）
# 不会把后续分支/推送一起堵死。2026-10-19 实际遇到过这种僵住 20+ 分钟的情况。
concurrency:
  group: dokku-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Reading this workflow's own run history is what tells the deployment step
  # which commit actually reached the host last.
  actions: read

jobs:
  # The gate.
  #
  # The type check used to happen inside the production build, on the host,
  # where it took eleven minutes and took the whole box down with it: the
  # kernel's OOM killer reaps sshd and nginx, and the symptom is a site that
  # accepts connections and never answers. The build itself compiles in 44
  # seconds — it is the type check that does not fit in that machine.
  #
  # So the type check moved here, to a runner with memory to spare, and the
  # host is left to do what it is good at: compile. The build still happens on
  # the host; only the *checking* moved.
  #
  # The deploy waits for this job, so a commit that does not type-check or
  # does not pass its tests never reaches the host at all.
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    outputs:
      # Whether this commit has to be deployed. `false` only when nothing but
      # documentation changed — see the detection step.
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The full history: the detection step diffs against the last commit
          # that reached the host, and a shallow clone does not have it.
          fetch-depth: 0

      # A documentation-only commit does not need the host to rebuild.
      #
      # The host has 3.8 GiB of RAM and no swap, and a build there has taken
      # the whole machine down four times — once on a commit that changed
      # nothing but Markdown. The cost of a deployment does not depend on the
      # size of the change, so a commit that only moves documentation is
      # exactly the one that should not pay for a rebuild.
      #
      # The base is the last commit whose *deploy job* succeeded: a run whose
      # deploy was skipped deployed nothing, so it is not a base. Diffing from
      # the real base means a skipped deployment can never hide code that
      # still has to go out.
      - name: 检测是否只是文档改动
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          # The default is to deploy. Skipping a deployment that was needed is
          # the one failure that matters here, so the answer starts at "yes" and
          # is only taken away when the diff is *known* to be documentation.
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          base=""
          for run in $(gh api "repos/$repo/actions/workflows/deploy.yml/runs?branch=server&per_page=6" --jq '.[].id' || true); do
            conclusion=$(gh api "repos/$repo/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name=="deploy") | .conclusion] | .[0] // ""' || true)
            if [ "$conclusion" = "success" ]; then
              base=$(gh api "repos/$repo/actions/runs/$run" --jq '.head_sha' || true)
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "no previous deployment found — deploying"
            exit 0
          fi
          changed=$(git diff --name-only "$base"..HEAD)
          echo "base: $base"
          echo "$changed"
          # A Markdown file the running application reads at request time still
          # has to be deployed: the three protocol documents are rendered by the
          # admin pages and read by the assistant's readers.
          runtime_read=$(printf '%s\n' "$changed" | grep -E '^docs/(模型适配协议|搜索适配协议|文本适配协议)/' || true)
          non_doc=$(printf '%s\n' "$changed" | grep -v -E '\.md$' || true)
          if [ -n "$non_doc" ] || [ -n "$runtime_read" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner has no pnpm of its own. `corepack enable` reads the pin in
      # package.json ("packageManager": "pnpm@10.28.0"), so the runner installs
      # exactly the version the lockfile was written with — the same version the
      # Dockerfile installs, and the same one this repository is developed with.
      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

  deploy:
    needs: verify
    # A documentation-only commit does not reach the host. Everything else does.
    if: needs.verify.result == 'success' && needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须：浅克隆会让 Dokku 构建失败

      - name: Deploy to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The action pushes this branch name to the Dokku remote, and Dokku
          # builds whatever arrives. The Debian work lives on `server`; the
          # action defaults to `master`, which would push the frozen Vercel
          # code instead — and fail, because the Dokku app's own history is on
          # master and the push is rejected as non-fast-forward.
          branch: server
