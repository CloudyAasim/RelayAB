# RelayAB — nginx reverse proxy.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/relayab
#   sudo ln -s /etc/nginx/sites-available/relayab /etc/nginx/sites-enabled/relayab
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo certbot --nginx -d api.aasim.l.cd

upstream relayab_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aasim.l.cd;

    # certbot rewrites this block to redirect to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aasim.l.cd;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/api.aasim.l.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aasim.l.cd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The image-editing endpoint (/v1/images/edits) accepts base64 payloads in
    # the JSON body. Next.js itself caps that at 2 MB via serverActions, but
    # nginx has its own default of 1 MB and would reject first with a 413.
    client_max_body_size 10m;

    # --- Security headers ---------------------------------------------------
    # The app sets its own baseline; these two matter most for a public
    # API endpoint and are cheap to enforce at the edge as well.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://relayab_app;
        proxy_http_version 1.1;

        # --- Server-sent events --------------------------------------------
        # Every /v1 and /anthropic surface streams. nginx buffers responses by
        # default, which would hold the whole answer and then flush it at once
        # — the user sees a frozen client followed by a sudden wall of text.
        # These three settings are what turn nginx back into a passthrough.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection "";

        # The proxy routes set maxDuration=300; stay comfortably above it.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # --- Forwarded headers ------------------------------------------------
        # NOT optional. lib/public-url.ts derives the instance's public address
        # from x-forwarded-proto / x-forwarded-host when VERCEL_URL and
        # RELAY_PUBLIC_URL are both unset. Drop these and the docs pages and
        # /healthz advertise the app as http://127.0.0.1:3000.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
